  <style>
    * {

      font-size: 48px;

    }

    .subtitle {
      color: #c5a568;
      font-style: italic;
      font-size: 20px;
    }

    .divider {

      background: #c5a568;
      margin: 35px auto;
    }

    .quote {
      font-size: 23px;
      font-style: italic;
      max-width: 500px;
      margin: auto;
      line-height: 1.5;
    }

    .navigation {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 540px;
      margin: 45px auto;
    }

    .navigation a {
      color: #f1ebdd;
      text-decoration: none;
      border: 1px solid #806b48;
      padding: 15px 10px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      transition: .3s;
    }

    .navigation a:hover {
      background: #c5a568;
      color: #101a32;
      box-shadow: 0 0 18px #c5a56855;
    }

    footer {
      color: #c5a568;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
    }

    @media (max-width: 500px) {
      .archive {
        padding: 40px 15px;
      }

      .navigation {
        grid-template-columns: 1fr;
      }
